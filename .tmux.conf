#movement

bind -n 'C-h' select-pane -L
bind -n 'C-j' select-pane -D
bind -n 'C-k' select-pane -U
bind -n 'C-l' select-pane -R

bind -n M-h resize-pane -L 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2
bind -n M-l resize-pane -R 2

set -s escape-time 0

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
# Also copy to system clipboard
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i'

# Status bar
set-option -g status-right '#[fg=colour250]#{window_width}x#{window_height} #[bg=colour237] %b %d %H:%M '

set-option -g history-limit 5000

#bottom bar
set -g status-bg colour235
set -g status-fg colour75
set -g status-left ''
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=240]#F '
setw -g window-status-format ' #I#[fg=colour245]:#[fg=colour250]#W#[fg=colour244]#F '
